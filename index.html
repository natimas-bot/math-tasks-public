<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>משימות מתמטיקה</title>
  <style>
    :root{--navy:#113b5e;--blue:#1677d2;--blue2:#0d66b2;--mint:#e8f7f2;--paper:#f5fbff;--ink:#183044;--muted:#6b7d8d;--card:#fff;--line:#dce8f1;--gold:#fff3c4;--red:#c53f47}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,"Noto Sans Hebrew",sans-serif;color:var(--ink);background:var(--paper);min-height:100vh}
    body:before{content:"π   √x   y=mx+b   ∑   △   x²+y²   f(x)   90°   ∫   a²+b²=c²   ⅓   ∠ABC";position:fixed;inset:0;z-index:-2;font-size:34px;line-height:3.5;word-spacing:34px;color:rgba(31,103,158,.052);transform:rotate(-7deg) scale(1.12);padding:20px;overflow:hidden}
    body:after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(235,247,255,.9))}
    .wrap{max-width:780px;margin:auto;padding:18px 14px 44px}
    .hero{background:linear-gradient(145deg,#103957,#195f8d);color:#fff;border-radius:28px;padding:26px 22px;box-shadow:0 13px 32px rgba(18,56,90,.2);position:relative;overflow:hidden;min-height:170px}
    .hero:before{content:"x²  +  y²  =  r²\Aπr²    √49=7\Ay = mx + b";white-space:pre;position:absolute;left:20px;top:24px;font-family:Georgia,serif;font-size:21px;line-height:1.8;opacity:.14;transform:rotate(-4deg)}
    h1{font-size:34px;margin:0 0 8px;position:relative;z-index:1}.subtitle{font-size:17px;opacity:.92;position:relative;z-index:1}
    .hero-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;position:relative;z-index:1}.class-pill,.count-pill{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:8px 13px;border-radius:999px;font-weight:700}.count-pill{background:rgba(214,244,255,.16)}
    .teacher{margin-top:14px;background:#fff9df;border:1px solid #f1dfa4;border-radius:18px;padding:14px 16px;box-shadow:0 5px 16px rgba(84,70,25,.06);line-height:1.5}.teacher b{display:block;margin-bottom:4px;color:#715a12}
    .section{margin-top:18px;background:rgba(255,255,255,.8);border:1px solid rgba(220,232,241,.94);border-radius:22px;padding:14px;box-shadow:0 8px 24px rgba(47,84,113,.08)}
    .section-title{display:flex;align-items:center;gap:9px;font-size:23px;font-weight:800;background:var(--mint);border-radius:14px;padding:11px 14px;margin-bottom:10px}.section-note{color:var(--muted);font-size:14px;margin:-2px 4px 12px;line-height:1.45}
    .task{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 4px 12px rgba(44,78,104,.06);position:relative;overflow:hidden}.task.important{border-color:#efd579;box-shadow:0 5px 16px rgba(186,145,25,.11)}.task.important:before{content:"";position:absolute;right:0;top:0;bottom:0;width:5px;background:#e8bd31}
    .task-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:20px;font-weight:800;margin-bottom:6px}.desc{color:#4f6575;line-height:1.45;margin:4px 0 10px}.meta{font-size:13px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center}.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
    .tag{background:#eef6ff;color:#1466ad;border-radius:999px;padding:4px 9px;font-size:12px;white-space:nowrap}.tag.new{background:#e4f8ef;color:#10704c}.tag.important{background:var(--gold);color:#795b00}.tag.source{background:#f0f2f5;color:#52616d}.due.today{color:#a84300;font-weight:700}.due.overdue{color:var(--red);font-weight:700}.due.soon{color:#0b6d57;font-weight:700}
    .btn{display:inline-flex;align-items:center;gap:7px;margin-top:13px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;text-decoration:none;padding:11px 15px;border-radius:11px;font-weight:700;box-shadow:0 5px 12px rgba(22,119,210,.2)}
    .old .task{padding:13px 14px}.old .title{font-size:17px}.old .btn{margin-top:9px;padding:8px 12px;background:#fff;color:#176ebd;border:1px solid #acd0ee;box-shadow:none}.old .task.important:before{display:none}
    .recent-archive-title{font-size:15px;font-weight:800;color:#456275;margin:12px 4px 5px}.archive-group{margin-top:10px;border:1px solid var(--line);border-radius:15px;background:#fbfdff;overflow:hidden}.archive-group summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:800;color:#31566f;display:flex;justify-content:space-between;gap:10px;align-items:center}.archive-group summary::-webkit-details-marker{display:none}.archive-group summary:after{content:"⌄";font-size:18px;color:#6d8393}.archive-group[open] summary:after{content:"⌃"}.archive-group-body{padding:0 10px 10px}.group-count{font-size:12px;font-weight:700;background:#edf5fb;color:#577184;border-radius:999px;padding:4px 8px}
    .empty{text-align:center;color:var(--muted);padding:22px 10px}.loading{text-align:center;padding:50px;color:var(--muted)}
    .landing{max-width:680px;margin:50px auto;padding:18px}.landing-card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 12px 30px rgba(42,77,105,.1)}.landing h1{color:var(--navy);margin-bottom:8px}.class-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}.class-link{display:block;text-decoration:none;background:linear-gradient(145deg,#f6fbff,#eaf6ff);border:1px solid #cee3f2;border-radius:18px;padding:22px;text-align:center;color:#174f78;font-size:21px;font-weight:800}.class-link small{display:block;font-size:13px;color:#6b7d8d;margin-top:6px;font-weight:600}
    @media(max-width:520px){h1{font-size:29px}.hero{padding:24px 18px;min-height:155px}.hero:before{font-size:17px;left:8px;opacity:.1}.section-title{font-size:20px}.task-top{display:block}.badges{justify-content:flex-start;margin-top:8px}.btn{width:100%;justify-content:center}.class-grid{grid-template-columns:1fr}.landing{margin-top:20px}}
  </style>
</head>
<body>
<div id="app"><div class="loading">טוען משימות…</div></div>
<script>
  const $=s=>document.querySelector(s);
  const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const fmt=iso=>iso?new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'numeric',year:'numeric'}).format(new Date(iso)):'';
  const dayStart=value=>{const d=new Date(value);d.setHours(0,0,0,0);return d};
  const ageDays=iso=>{if(!iso)return 999;return Math.floor((dayStart(new Date())-dayStart(iso))/86400000)};
  const rel=iso=>{const days=ageDays(iso);if(days<=0)return 'פורסם היום';if(days===1)return 'פורסם אתמול';return `פורסם לפני ${days} ימים`};
  const params=new URLSearchParams(location.search);
  const requestedClass=(params.get('class')||'').trim();

  function repoInfo(){
    const owner=location.hostname.split('.')[0];
    const parts=location.pathname.split('/').filter(Boolean);
    const repo=parts[0]||`${owner}.github.io`;
    return {owner,repo};
  }
  function dataUrl(){const r=repoInfo();return `https://raw.githubusercontent.com/${encodeURIComponent(r.owner)}/${encodeURIComponent(r.repo)}/main/data.json?t=${Date.now()}`}

  function dueLabel(iso){if(!iso)return {text:'',cls:''};const days=Math.round((dayStart(iso)-dayStart(new Date()))/86400000);if(days<0)return {text:`עבר מועד ההגשה (${fmt(iso)})`,cls:'overdue'};if(days===0)return {text:'להגשה היום',cls:'today'};if(days===1)return {text:'להגשה מחר',cls:'soon'};if(days<=3)return {text:`נותרו ${days} ימים`,cls:'soon'};return {text:`להגשה עד ${fmt(iso)}`,cls:''}}
  function sourceInfo(url){try{const raw=String(url||'').toLowerCase();const h=new URL(url).hostname.toLowerCase();if(raw.includes('moodle'))return {name:'Moodle',button:'פתח ב־Moodle ↗'};if(raw.includes('classit'))return {name:'Classit',button:'פתח ב־Classit ↗'};if(h.includes('forms.google')||h.includes('docs.google'))return {name:'Google',button:'פתח ב־Google ↗'};if(h.includes('geogebra'))return {name:'GeoGebra',button:'פתח ב־GeoGebra ↗'};return {name:h.replace(/^www\./,''),button:'פתח משימה ↗'}}catch(e){return {name:'אתר חיצוני',button:'פתח משימה ↗'}}}
  function effectiveArchivedAt(t,settings){if(t.status==='archived')return t.archivedAt||t.publishedAt||t.createdAt;const days=Number(settings.autoArchiveDays||7);if(!t.pinned&&ageDays(t.publishedAt)>=days){const d=new Date(t.publishedAt||t.createdAt);d.setDate(d.getDate()+days);return d.toISOString()}return ''}
  function isArchived(t,settings){return Boolean(effectiveArchivedAt(t,settings))}
  function taskCard(t,old=false,newDays=3){const due=dueLabel(t.dueDate);const src=sourceInfo(t.url);const isNew=!old&&ageDays(t.publishedAt)<Number(newDays||3);const badges=[isNew?'<span class="tag new">🆕 חדש</span>':'',t.important?'<span class="tag important">⭐ חשוב</span>':'',t.tag?`<span class="tag">${esc(t.tag)}</span>`:'',`<span class="tag source">${esc(src.name)}</span>`].filter(Boolean).join('');return `<article class="task ${t.important&&!old?'important':''}"><div class="task-top"><div><div class="title">${esc(t.title)}</div>${t.description?`<div class="desc">${esc(t.description)}</div>`:''}<div class="meta"><span>${esc(rel(t.publishedAt))}</span>${due.text?`<span>·</span><span class="due ${due.cls}">${esc(due.text)}</span>`:''}</div></div><div class="badges">${badges}</div></div><a class="btn" href="${esc(t.url)}" target="_blank" rel="noopener">${esc(src.button)}</a></article>`}
  function archiveAge(t,settings){return ageDays(effectiveArchivedAt(t,settings))}
  function archiveMonthKey(t,settings){const d=new Date(effectiveArchivedAt(t,settings)||t.publishedAt||t.createdAt||Date.now());return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
  function archiveMonthLabel(t,settings){const d=new Date(effectiveArchivedAt(t,settings)||t.publishedAt||t.createdAt||Date.now());return new Intl.DateTimeFormat('he-IL',{month:'long',year:'numeric'}).format(d)}
  function archiveHtml(tasks,settings){if(!tasks.length)return '<div class="empty">עדיין אין משימות קודמות.</div>';const recentDays=Number(settings.recentArchiveDays||7);const recent=tasks.filter(t=>archiveAge(t,settings)<=recentDays);const older=tasks.filter(t=>archiveAge(t,settings)>recentDays);let html='';if(recent.length){html+=`<div class="recent-archive-title">נגישות מיד — הועברו לקודמות ב־${recentDays} הימים האחרונים</div>`+recent.map(t=>taskCard(t,true,settings.newBadgeDays)).join('')}if(older.length){const groups={};older.forEach(t=>{const key=archiveMonthKey(t,settings);if(!groups[key])groups[key]={label:archiveMonthLabel(t,settings),items:[]};groups[key].items.push(t)});html+='<div class="recent-archive-title">משימות ישנות יותר</div>'+Object.keys(groups).sort().reverse().map(key=>{const g=groups[key];return `<details class="archive-group"><summary><span>${esc(g.label)}</span><span class="group-count">${g.items.length} משימות</span></summary><div class="archive-group-body">${g.items.map(t=>taskCard(t,true,settings.newBadgeDays)).join('')}</div></details>`}).join('')}return html}
  function classMessage(settings,cls){const m=settings.classMessages||{};if(Object.prototype.hasOwnProperty.call(m,cls))return String(m[cls]||'');if(cls==='ז׳')return String(settings.legacyTeacherMessage||'');return ''}
  function renderLanding(data){const classes=data.settings.classes||['ז׳'];$('#app').innerHTML=`<div class="landing"><div class="landing-card"><h1>📐 ${esc(data.settings.title||'משימות מתמטיקה')}</h1><div class="subtitle" style="color:#60788a">בחר כיתה</div><div class="class-grid">${classes.map(c=>`<a class="class-link" href="?class=${encodeURIComponent(c)}">${esc(c)}<small>פתח את דף המשימות</small></a>`).join('')}</div></div></div>`}
  function renderClass(data,cls){const settings=data.settings||{};const showGeneral=settings.showGeneralTasks!==false;const visible=(data.tasks||[]).filter(t=>t.class===cls||(showGeneral&&t.class==='כללי'));const active=visible.filter(t=>!isArchived(t,settings)).sort((a,b)=>new Date(b.publishedAt||b.createdAt||0)-new Date(a.publishedAt||a.createdAt||0));const archived=visible.filter(t=>isArchived(t,settings)).sort((a,b)=>new Date(effectiveArchivedAt(b,settings)||0)-new Date(effectiveArchivedAt(a,settings)||0));const msg=classMessage(settings,cls);document.title=`${settings.title||'משימות מתמטיקה'} – ${cls}`;$('#app').innerHTML=`<div class="wrap"><header class="hero"><h1>${esc(settings.title||'משימות מתמטיקה')}</h1><div class="subtitle">${esc(settings.subtitle||'כל המשימות והתרגולים במקום אחד')}</div><div class="hero-row"><div class="class-pill">📐 כיתה ${esc(cls)}</div><div class="count-pill">🎯 ${active.length} משימות פעילות</div></div></header>${msg?`<div class="teacher"><b>💬 הודעה מהמורה</b>${esc(msg)}</div>`:''}<section class="section"><div class="section-title">🎯 משימות נוכחיות</div><div class="section-note">המשימות החדשות ביותר מופיעות ראשונות</div>${active.length?active.map(t=>taskCard(t,false,settings.newBadgeDays)).join(''):'<div class="empty">אין כרגע משימות פעילות.</div>'}</section><section class="section old"><div class="section-title">🕘 משימות קודמות</div><div class="section-note">משימות שהועברו לאחרונה נשארות פתוחות למאחרים. משימות ישנות יותר מקופלות לפי חודש, וכל הקישורים נשארים פעילים.</div>${archiveHtml(archived,settings)}</section></div>`}
  fetch(dataUrl(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('לא נמצא קובץ הנתונים');return r.json()}).then(data=>{const classes=(data.settings&&data.settings.classes)||['ז׳'];if(!requestedClass){renderLanding(data);return}const cls=classes.includes(requestedClass)?requestedClass:classes[0];renderClass(data,cls)}).catch(err=>{$('#app').innerHTML=`<div class="wrap"><div class="section"><div class="empty">לא הצלחנו לטעון את המשימות כרגע.<br><small>${esc(err.message||err)}</small></div></div></div>`})
</script>
</body>
</html>
